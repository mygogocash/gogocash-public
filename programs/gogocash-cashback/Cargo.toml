[package]
name = "gogocash-cashback"
version = "0.1.0"
description = "GoGoCash cashback program: pays approved USDC payouts exactly once (contract v0)"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "gogocash_cashback"

# Feature set copied from the anchor 1.2.0 template (`cargo_toml_v1`). The
# macros emit cfgs for these names, so declaring them keeps `unexpected_cfgs`
# quiet without a crate-level allow.
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
# anchor-spl 1.2.0's `idl-build` implements IdlBuild for
# `token_interface::{Mint, TokenAccount}` unconditionally, and that module
# only exists with `token_2022`, so the IDL build (and only the IDL build)
# turns it on. The SBF program never compiles the Token-2022 interface.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Contract v0 assigns no mainnet program id (docs/CONTRACT.md 2.4), so
# building with this feature is a compile_error! in src/lib.rs.
mainnet = []

[dependencies]
# No `init-if-needed`: re-initialization attacks stay structurally impossible.
anchor-lang = "=1.2.0"
# Classic SPL Token and associated-token constraints only. The program never
# names a Token-2022 type: every token account is
# `anchor_spl::token::{Mint, TokenAccount}`, whose owner check accepts the
# classic Token program only (`token_2022` is enabled by `idl-build` alone).
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "associated_token"] }
# 1.1.3 has no mandatory dependencies, so it cannot conflict with the
# solana-* 3.x line anchor-lang 1.2 pins.
solana-security-txt = "=1.1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
