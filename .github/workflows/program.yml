# Program CI for gogocash-public: builds, checks and tests the
# gogocash_cashback Solana program (Anchor 1.2.0, Agave 4.3.0,
# platform-tools v1.57, SBPFv3). See docs/BUILD.md.
#
# Hardening rules for every workflow in this repository (same as ci.yml):
#   - Actions are pinned by full commit SHA (the comment names the tag).
#   - Downloaded binaries are checked against a SHA-256 before use; nothing is
#     piped from curl into a shell.
#   - No job receives secrets, and the token is read-only.
#   - No `${{ }}` expression is expanded inside a `run:` script; values go
#     through `env:` instead.
#   - Downloaded toolchains are never restored from a cache: platform-tools
#     is downloaded and checksummed on every run. The cargo caches (registry
#     and target/) follow GitHub's ref scoping: a cache saved by a pull
#     request is visible to that pull request only, never to main.
#   - Every crates.io package in either lockfile is outside the org's 7-day
#     release-age hold (`crate-age` job).
#
# The `program` job at the bottom is the single status to require on `main`.
name: Program

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: program-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Must equal `channel` in rust-toolchain.toml; every job asserts it.
  RUST_TOOLCHAIN: "1.97.1"
  # Agave publishes no checksum file for its release tarball. This SHA-256 was
  # computed from the downloaded asset and matches GitHub's asset digest.
  AGAVE_VERSION: "4.3.0"
  AGAVE_SHA256: "c97289a8abb1d0efb497d8b5cb285baabd9b7f8ea6647f5d145c5dc8ff3611e8"
  # cargo-build-sbf downloads platform-tools without any checksum check, so CI
  # pre-seeds them from a checksummed tarball. No checksum file is published;
  # this SHA-256 was computed from the asset and matches GitHub's asset digest.
  PLATFORM_TOOLS_VERSION: "v1.57"
  PLATFORM_TOOLS_SHA256: "b0f7af104adf726fff2a6a09ea2eb2f2d2965c92295f4d7388c08d140e0c2b00"
  # Anchor publishes no SHA256SUMS. This SHA-256 was computed from the release
  # asset, matches GitHub's asset digest, and its build-provenance attestation
  # verified with `gh attestation verify --repo otter-sec/anchor`.
  ANCHOR_VERSION: "1.2.0"
  ANCHOR_SHA256: "0c9c41a3292c281cc6eadb78d6e1c8224d8324a34b0736a89d640fd314db05b7"
  # From trivy_0.72.0_checksums.txt, which Aqua publishes and signs.
  TRIVY_VERSION: "0.72.0"
  TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
  PROGRAM_SO: target/deploy/gogocash_cashback.so
  PROGRAM_IDL: target/idl/gogocash_cashback.json
  COMMITTED_IDL: idl/gogocash_cashback.json

jobs:
  lockfiles:
    name: resolve Cargo lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the host Rust toolchain
        run: |
          set -euo pipefail
          grep -Fqx "channel = \"${RUST_TOOLCHAIN}\"" rust-toolchain.toml
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version
      - name: Resolve the program lockfile (Cargo.lock)
        run: |
          set -euo pipefail
          if [ -f Cargo.lock ]; then
            # --locked fails if Cargo.lock no longer matches the manifests.
            cargo metadata --locked --format-version 1 > /dev/null
            echo "Cargo.lock is committed and current."
          else
            cargo generate-lockfile
            echo "::warning file=Cargo.lock::Cargo.lock is not committed, so this run resolved a fresh one and the build is not reproducible. Commit Cargo.lock from the cargo-lockfiles artifact."
          fi
      - name: Resolve the LiteSVM lockfile (tests-litesvm/Cargo.lock)
        working-directory: tests-litesvm
        run: |
          set -euo pipefail
          committed=false
          if [ -f Cargo.lock ]; then
            committed=true
          fi
          # Seeds from litesvm v0.16.0's own lockfile (sha256-checked); a no-op
          # once tests-litesvm/Cargo.lock is committed. Never use
          # `cargo generate-lockfile` here: a fresh resolution does not compile.
          bash ./seed-lockfile.sh
          cargo metadata --locked --format-version 1 > /dev/null
          if [ "${committed}" = false ]; then
            echo "::warning file=tests-litesvm/Cargo.lock::tests-litesvm/Cargo.lock is not committed, so this run seeded one. Commit it from the cargo-lockfiles artifact."
          fi
          # Expected: litesvm 0.16.0 on the Agave 4.2.x runtime and wincode 0.5.x.
          for crate in litesvm agave-feature-set solana-program-runtime wincode; do
            versions="$(awk -v want="name = \"${crate}\"" '$0 == want { getline; printf "%s ", $3 }' Cargo.lock)"
            echo "${crate}: ${versions:-absent}"
          done
      - name: Upload the lockfiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-lockfiles
          path: |
            Cargo.lock
            tests-litesvm/Cargo.lock
          if-no-files-found: error
          retention-days: 14

  fmt-clippy:
    name: rustfmt and clippy
    needs: lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the host Rust toolchain
        run: |
          set -euo pipefail
          grep -Fqx "channel = \"${RUST_TOOLCHAIN}\"" rust-toolchain.toml
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version
      - name: Download the lockfiles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cargo-lockfiles
          path: ${{ runner.temp }}/cargo-lockfiles
      - name: Use the resolved lockfiles
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/cargo-lockfiles/Cargo.lock" Cargo.lock
          cp "${RUNNER_TEMP}/cargo-lockfiles/tests-litesvm/Cargo.lock" tests-litesvm/Cargo.lock
          sha256sum Cargo.lock tests-litesvm/Cargo.lock
      - name: rustfmt (program workspace)
        run: cargo fmt --all --check
      - name: rustfmt (tests-litesvm workspace)
        working-directory: tests-litesvm
        run: cargo fmt --all --check
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: program-clippy-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-anchor${{ env.ANCHOR_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'programs/*/Cargo.toml') }}
          restore-keys: |
            program-clippy-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-anchor${{ env.ANCHOR_VERSION }}-
      - name: clippy (program workspace, host target)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  build:
    name: anchor build (SBPFv3)
    needs: lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the host Rust toolchain
        run: |
          set -euo pipefail
          grep -Fqx "channel = \"${RUST_TOOLCHAIN}\"" rust-toolchain.toml
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version
      - name: Download the lockfiles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cargo-lockfiles
          path: ${{ runner.temp }}/cargo-lockfiles
      - name: Use the resolved lockfiles
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/cargo-lockfiles/Cargo.lock" Cargo.lock
          cp "${RUNNER_TEMP}/cargo-lockfiles/tests-litesvm/Cargo.lock" tests-litesvm/Cargo.lock
          sha256sum Cargo.lock tests-litesvm/Cargo.lock
      - name: Install Agave (cargo-build-sbf)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -sSfL --retry 3 -o solana-release.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/v${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${AGAVE_SHA256}  solana-release.tar.bz2" | sha256sum -c -
          tar -xjf solana-release.tar.bz2
          rm -f solana-release.tar.bz2
          echo "${RUNNER_TEMP}/solana-release/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/solana-release/bin/cargo-build-sbf" --version
          "${RUNNER_TEMP}/solana-release/bin/solana" --version
      - name: Install platform-tools (checksummed on every run)
        run: |
          set -euo pipefail
          # Deliberately not cached. A restored tree of compiler binaries would
          # skip this checksum, so every run downloads the tarball (about
          # 531 MB) and verifies it before anything uses it.
          # cargo-build-sbf reuses $HOME/.cache/solana/<version>/platform-tools
          # when it holds rust/bin/rustc and rust/bin/cargo, and only then skips
          # its own unchecked download.
          tarball="${RUNNER_TEMP}/platform-tools-linux-x86_64.tar.bz2"
          pt_dir="${HOME}/.cache/solana/${PLATFORM_TOOLS_VERSION}/platform-tools"
          curl -sSfL --retry 3 -o "${tarball}" \
            "https://github.com/anza-xyz/platform-tools/releases/download/${PLATFORM_TOOLS_VERSION}/platform-tools-linux-x86_64.tar.bz2"
          echo "${PLATFORM_TOOLS_SHA256}  ${tarball}" | sha256sum -c -
          rm -rf "${HOME}/.cache/solana/${PLATFORM_TOOLS_VERSION}"
          mkdir -p "${pt_dir}"
          tar -xjf "${tarball}" -C "${pt_dir}"
          rm -f "${tarball}"
          test -x "${pt_dir}/rust/bin/rustc"
          test -x "${pt_dir}/rust/bin/cargo"
          "${pt_dir}/rust/bin/rustc" --version
      - name: Install Anchor CLI
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/anchor/bin"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/anchor/bin/anchor" \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          echo "${ANCHOR_SHA256}  ${RUNNER_TEMP}/anchor/bin/anchor" | sha256sum -c -
          chmod 0755 "${RUNNER_TEMP}/anchor/bin/anchor"
          echo "${RUNNER_TEMP}/anchor/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/anchor/bin/anchor" --version
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/deploy/*-keypair.json
          key: program-build-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-agave${{ env.AGAVE_VERSION }}-pt${{ env.PLATFORM_TOOLS_VERSION }}-anchor${{ env.ANCHOR_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'programs/*/Cargo.toml') }}
          restore-keys: |
            program-build-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-agave${{ env.AGAVE_VERSION }}-pt${{ env.PLATFORM_TOOLS_VERSION }}-anchor${{ env.ANCHOR_VERSION }}-
      - name: anchor build --arch v3
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          sha256sum Cargo.lock > "${RUNNER_TEMP}/Cargo.lock.sha256"
          # --ignore-keys: declare_id! is a placeholder with no keypair, so
          # never compare it with one (that check would also create one).
          # No trailing `-- <args>`: anchor appends them to cargo build-sbf
          # and to the IDL `cargo test` alike.
          anchor build --ignore-keys --arch v3 --tools-version "${PLATFORM_TOOLS_VERSION}"
          # The build must not have re-resolved any dependency.
          sha256sum -c "${RUNNER_TEMP}/Cargo.lock.sha256"
          ls -l target/deploy target/idl
      - name: Delete the throwaway deploy keypair
        id: scrub-keypair
        if: always()
        run: |
          set -euo pipefail
          # cargo-build-sbf always writes target/deploy/<lib>-keypair.json with
          # a fresh random key. It is not the program's key (the id is a
          # placeholder) and must never be uploaded or cached.
          if [ -d target ]; then
            find target -name '*-keypair.json' -type f -print -delete
            if [ -n "$(find target -name '*-keypair.json' -type f)" ]; then
              echo "::error::a keypair file is still present under target/"
              exit 1
            fi
          fi
      - name: Check the artifact is SBPFv3 and embeds security.txt
        run: |
          set -euo pipefail
          node --version
          node scripts/check-sbpf.mjs --self-test
          node scripts/check-sbpf.mjs --expect-security-txt "${PROGRAM_SO}"
          if ! grep -qaF -e '=======BEGIN SECURITY.TXT V1=======' "${PROGRAM_SO}"; then
            echo "::error file=${PROGRAM_SO}::security.txt marker not found in the program binary"
            exit 1
          fi
          sha256sum "${PROGRAM_SO}"
      - name: Check the IDL
        run: |
          set -euo pipefail
          test -s "${PROGRAM_IDL}"
          jq -c '{name: .metadata.name, instructions: [.instructions[] | {name, discriminator}]}' "${PROGRAM_IDL}"
          # ping's discriminator is sha256("global:ping")[..8].
          if ! jq -e '.metadata.name == "gogocash_cashback"
            and ([.instructions[].name] == ["ping"])
            and (.instructions[0].discriminator == [173, 0, 94, 236, 73, 133, 225, 153])' \
            "${PROGRAM_IDL}" > /dev/null; then
            echo "::error file=${PROGRAM_IDL}::the IDL does not describe gogocash_cashback with a single ping instruction"
            exit 1
          fi
          if [ ! -f "${COMMITTED_IDL}" ]; then
            echo "::warning file=${COMMITTED_IDL}::No committed IDL yet, so the IDL diff is SKIPPED. Commit gogocash_cashback.json from the gogocash_cashback-idl artifact as ${COMMITTED_IDL}."
            exit 0
          fi
          diff -u "${COMMITTED_IDL}" "${PROGRAM_IDL}"
          echo "IDL matches ${COMMITTED_IDL}."
      - name: Upload the program binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gogocash_cashback-so
          # The .so only, by explicit path: never target/deploy wholesale.
          path: target/deploy/gogocash_cashback.so
          if-no-files-found: error
          retention-days: 14
      - name: Upload the IDL
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gogocash_cashback-idl
          path: |
            target/idl/gogocash_cashback.json
            target/types/gogocash_cashback.ts
          if-no-files-found: error
          retention-days: 14
      # Saved only if the keypair scrub succeeded: target/ is cached, and a
      # private key must never reach the cache (the path exclusion above is a
      # second line of defence, not the first).
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.scrub-keypair.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/deploy/*-keypair.json
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  litesvm:
    name: LiteSVM tests (built .so)
    needs: [lockfiles, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the host Rust toolchain
        run: |
          set -euo pipefail
          grep -Fqx "channel = \"${RUST_TOOLCHAIN}\"" rust-toolchain.toml
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version
      - name: Download the lockfiles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cargo-lockfiles
          path: ${{ runner.temp }}/cargo-lockfiles
      - name: Use the resolved lockfiles
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/cargo-lockfiles/Cargo.lock" Cargo.lock
          cp "${RUNNER_TEMP}/cargo-lockfiles/tests-litesvm/Cargo.lock" tests-litesvm/Cargo.lock
          sha256sum Cargo.lock tests-litesvm/Cargo.lock
      - name: Download the program binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: gogocash_cashback-so
          path: ${{ runner.temp }}/program
      - name: Check the downloaded binary is SBPFv3
        run: |
          set -euo pipefail
          node scripts/check-sbpf.mjs --expect-security-txt "${RUNNER_TEMP}/program/gogocash_cashback.so"
          sha256sum "${RUNNER_TEMP}/program/gogocash_cashback.so"
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            tests-litesvm/target
          key: litesvm-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('tests-litesvm/Cargo.lock', 'tests-litesvm/Cargo.toml') }}
          restore-keys: |
            litesvm-${{ runner.os }}-rust${{ env.RUST_TOOLCHAIN }}-
      - name: cargo test (LiteSVM, against the built .so)
        working-directory: tests-litesvm
        env:
          GOGOCASH_CASHBACK_SO: ${{ runner.temp }}/program/gogocash_cashback.so
        run: cargo test --locked
      - name: clippy (tests-litesvm workspace)
        working-directory: tests-litesvm
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Save the cargo cache
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            tests-litesvm/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  trivy:
    name: trivy (Rust lockfiles)
    needs: lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the lockfiles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cargo-lockfiles
          path: ${{ runner.temp }}/cargo-lockfiles
      - name: Use the resolved lockfiles
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/cargo-lockfiles/Cargo.lock" Cargo.lock
          cp "${RUNNER_TEMP}/cargo-lockfiles/tests-litesvm/Cargo.lock" tests-litesvm/Cargo.lock
          sha256sum Cargo.lock tests-litesvm/Cargo.lock
      - name: Install Trivy
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}/trivy" trivy
          rm -f "${RUNNER_TEMP}/trivy.tar.gz"
          "${RUNNER_TEMP}/trivy/trivy" --version
      - name: Scan the Rust lockfiles (HIGH, CRITICAL)
        run: |
          set -euo pipefail
          # Rust lockfiles only. package-lock.json still carries a known
          # bigint-buffer advisory that ticket R3 removes, so the npm lockfile
          # is NOT scanned here yet; add it once R3 lands.
          for lock in Cargo.lock tests-litesvm/Cargo.lock; do
            echo "Scanning ${lock}"
            "${RUNNER_TEMP}/trivy/trivy" fs \
              --cache-dir "${RUNNER_TEMP}/trivy-cache" \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --no-progress \
              "${lock}"
          done

  crate-age:
    name: crates.io release-age hold (7 days)
    needs: lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the lockfiles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cargo-lockfiles
          path: ${{ runner.temp }}/cargo-lockfiles
      - name: Use the resolved lockfiles
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/cargo-lockfiles/Cargo.lock" Cargo.lock
          cp "${RUNNER_TEMP}/cargo-lockfiles/tests-litesvm/Cargo.lock" tests-litesvm/Cargo.lock
          sha256sum Cargo.lock tests-litesvm/Cargo.lock
      - name: Check every crates.io package is at least 7 days old
        run: |
          set -euo pipefail
          # The host toolchain (1.97.1) has no stable publish-age resolver
          # setting, so a freshly resolved lockfile can pick up a crate
          # published yesterday. This reads each package's `pubtime` from the
          # crates.io sparse index and fails on anything inside the hold.
          node --version
          node scripts/check-crate-age.mjs --self-test
          node scripts/check-crate-age.mjs Cargo.lock tests-litesvm/Cargo.lock

  program:
    name: program
    # Always report, so a failed or skipped dependency can't leave the
    # required status missing instead of red.
    if: always()
    needs: [lockfiles, fmt-clippy, build, litesvm, trivy, crate-age]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: ${RESULTS}"
          count=0
          for result in ${RESULTS}; do
            count=$((count + 1))
            if [ "${result}" != "success" ]; then
              echo "::error::a required job finished as '${result}'"
              exit 1
            fi
          done
          if [ "${count}" -ne 6 ]; then
            echo "::error::expected 6 job results, got ${count}"
            exit 1
          fi
